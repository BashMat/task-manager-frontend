<header class="fixed left-0 top-0 z-10 w-full">
    <mat-toolbar class="flex items-center justify-between px-4">
        <a routerLink="/" class="text-lg">BashMat Task Manager</a>

        <div class="flex items-center gap-4">
            <ng-content select="[headerActions]"></ng-content>

            <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="User menu">
                <mat-icon>account_circle</mat-icon>
            </button>
            <mat-menu #menu="matMenu" xPosition="before">
                <button mat-menu-item (click)="GoToUserProfile()">
                    <mat-icon>account_circle</mat-icon>
                    <span>Profile</span>
                </button>
                <button mat-menu-item disabled>
                    <mat-icon>settings</mat-icon>
                    <span>Settings</span>
                </button>
                <button mat-menu-item (click)="SignOut()">
                    <mat-icon>logout</mat-icon>
                    <span>Sign out</span>
                </button>
            </mat-menu>
        </div>
    </mat-toolbar>
</header>
