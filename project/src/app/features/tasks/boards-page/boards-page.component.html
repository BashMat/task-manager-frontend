<dynamic-header>
  <div headerActions class="flex items-center gap-4">
    <mat-button-toggle-group name="view" [value]="selectedView()" aria-label="View" (change)="switchView($event.value)">
      <mat-button-toggle [value]="view.Board">
        <mat-icon>view_kanban</mat-icon>
      </mat-button-toggle>
      <mat-button-toggle [value]="view.Table">
        <mat-icon>view_list</mat-icon>
      </mat-button-toggle>
    </mat-button-toggle-group>
    <button mat-flat-button type="button" aria-label="Add Tracking Log" (click)="AddBoard()">
      <label>Add new Log</label>
      <mat-icon>add</mat-icon>
    </button>
  </div>
</dynamic-header>

<div>
  @if (selectedView() == view.Board)
  {
    @for (board of boards; track board.id)
    {
      <div class="my-2.5 mx-1">
        <board [board]=board (deleteBoardEvent)="DeleteBoard($event)"></board>
      </div>
    }
  }
  @else if (selectedView() == view.Table)
  {
    @for (board of boards; track board.id)
    {
      <div class="my-2.5 mx-1">
        <log-table [board]=board (deleteBoardEvent)="DeleteBoard($event)"></log-table>
      </div>
    }
  }
</div>
