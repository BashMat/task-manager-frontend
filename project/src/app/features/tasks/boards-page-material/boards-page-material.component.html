<div>
  <mat-toolbar>
    <span class="flex-1"></span>
    <button mat-mini-fab type="button" aria-label="Add Board" (click)="AddBoard()">
        <mat-icon>add</mat-icon>
    </button>
  </mat-toolbar>

  @for (board of boards; track board.id)
  {
    <div class="mt-5">
      <board-material [board]=board (deleteBoardEvent)="DeleteBoard($event)"></board-material>
    </div>
  }

</div>
