<div>
  <mat-card appearance="outlined">
    <mat-card-header class="flex items-center justify-between p-4">
      <mat-card-title-group class="flex items-center gap-4 flex-1">
        <mat-card-title>{{board().title}}</mat-card-title>
      </mat-card-title-group>

      <button mat-icon-button (click)="toggleCollapse()" [attr.aria-label]="isCollapsed() ? 'Expand' : 'Collapse'" class="mr-2">
        <mat-icon>{{ isCollapsed() ? 'expand_more' : 'expand_less' }}</mat-icon>
      </button>

      <button mat-icon-button [matMenuTriggerFor]="actionsMenu" aria-label="Board actions">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #actionsMenu="matMenu">
        <button mat-menu-item (click)="AddColumn()">
          <mat-icon>add</mat-icon>
          <span>Add new Status</span>
        </button>
        <button mat-menu-item (click)="AddCard()">
          <mat-icon>add_task</mat-icon>
          <span>Add new Entry</span>
        </button>
        <button mat-menu-item (click)="OpenDetails()">
          <mat-icon>details</mat-icon>
          <span>Details</span>
        </button>
        <button mat-menu-item (click)="DeleteBoard()" class="text-red-600">
          <mat-icon>delete_forever</mat-icon>
          <span>Delete</span>
        </button>
      </mat-menu>
    </mat-card-header>

    @if (!isCollapsed()) {
      <mat-card-content>
        <div>
          <table mat-table matSort [dataSource]="dataSource" class="mat-elevation-z8 demo-table">
            <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>No.</th>
              <td mat-cell *matCellDef="let element">{{element.id}}</td>
            </ng-container>

            <ng-container matColumnDef="title">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
              <td mat-cell *matCellDef="let element">{{element.title}}</td>
            </ng-container>

            <ng-container matColumnDef="status">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
              <td mat-cell *matCellDef="let element">
                <div class="{{this.getStatusColorClass(element.status)}} w-fit p-1 rounded-lg">{{element.status}}</div>
              </td>
            </ng-container>

            <ng-container matColumnDef="priority">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Priority</th>
              <td mat-cell *matCellDef="let element">{{element.priority}}</td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="OpenRowDetails(row)"></tr>
          </table>
        </div>
      </mat-card-content>
    }
  </mat-card>
</div>
