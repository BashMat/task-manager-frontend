<div>
  <mat-card appearance="outlined" (click)="OpenDetails()">
    <mat-card-header class="items-start flex justify-between">
      <mat-card-title-group class="flex-1 min-w-0">
        <mat-card-title>
          <p class="card-title-text">
            {{card().title}}
          </p>
        </mat-card-title>
      </mat-card-title-group>

      <button mat-icon-button [matMenuTriggerFor]="actionsMenu" aria-label="Card actions" class="card-actions-button" (click)="$event.stopPropagation()">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #actionsMenu="matMenu">
        <button mat-menu-item (click)="OpenDetails()">
          <mat-icon>details</mat-icon>
          <span>Details</span>
        </button>
        <button mat-menu-item (click)="DeleteCard()" class="text-red-600">
          <mat-icon>delete_forever</mat-icon>
          <span>Delete</span>
        </button>
      </mat-menu>
    </mat-card-header>
  </mat-card>
</div>
