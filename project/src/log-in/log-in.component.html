<div class="log-in">
    <div class="form-authorization-containter">
        <form class="form-authorization" [formGroup]="logInForm" (submit)="LogIn()">
            <div class="form-authorization-row">
                <label htmlFor="input-user">Имя пользователя/email:</label>
                <input id="input-user" type="text" placeholder="Username/email..." formControlName="logInData"/>
            </div>
            <div class="form-authorization-row">
                <label htmlFor="input-password">Пароль:</label>
                <input id="input-password" type="password" formControlName="password"/>
            </div>
            <p class="message" hidden>{{message}}</p>
            <button class="btn">Войти</button>
        </form>
        <div>
            <button class="btn" hidden>Забыли пароль?</button>
            <button class="btn" (click)="GoToSignUp()">Зарегистрироваться</button>
        </div>

    </div>
</div>

<router-outlet />
