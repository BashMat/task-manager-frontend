<div class="log-in">
    <div class="form-authorization-row">
        <label htmlFor="input-user">Имя пользователя:</label>
        <input id="input-user" type="text" placeholder="User..." />
    </div>
    <div class="form-authorization-row">
        <label htmlFor="input-password">Пароль:</label>
        <input id="input-password" type="password" />
    </div>
    <p class="message" hidden>{{message}}</p>
    <button class="btn">Войти</button>
  <div>
      <button class="btn">Забыли пароль?</button>
      <button class="btn" (click)="GoToSignUp()">Зарегистрироваться</button>
  </div>
</div>

<router-outlet />
