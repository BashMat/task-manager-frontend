<div class="sign-up">
    <div class="form-authorization-row">
        <label htmlFor="input-email">Email:</label>
        <input id="input-email" type="text" placeholder="E-mail address..." />
    </div>
    <div class="form-authorization-row">
        <label htmlFor="input-username">Имя пользователя:</label>
        <input id="input-username" type="text" placeholder="Username..." />
    </div>
    <div class="form-authorization-row">
        <label htmlFor="input-password">Пароль:</label>
        <input id="input-password" type="password" />
    </div>
    <div class="form-authorization-row">
        <label htmlFor="input-repeated-password">Повторите пароль:</label>
        <input id="input-repeated-password" type="password" />
    </div>
    <p class="message" hidden>{{message}}</p>
    <button class="btn">Зарегистрироваться</button>
    <div>
        <button class="btn">Уже зарегистрированы?</button>
    </div>
</div>

<router-outlet />
